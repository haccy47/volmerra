<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — VOLMERRA</title>
  <meta name="description" content="Log in to your Volmerra reader account.">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/seasons.js"></script>
  <script src="../assets/js/season.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container page-hero">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="page-lede">Sign in to reach your reading library, favorites and profile.</p>
    </div>

    <section class="section section--tight" style="padding-bottom: clamp(56px, 10vw, 104px);">
      <div class="container">
        <form class="form-card" id="login-form" novalidate>
          <p class="form-error" role="alert"></p>

          <div class="field">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" name="email" autocomplete="email" required>
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" autocomplete="current-password" required>
          </div>

          <button class="btn btn--primary btn--block" type="submit">Log in</button>

          <p class="form-footer">
            New to Volmerra? <a href="signup.html">Create an account</a>
          </p>
        </form>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/auth.js?v=2"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/search.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/forms.js"></script>
</body>
</html>
