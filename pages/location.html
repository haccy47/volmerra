<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="A location of the Volmerra universe.">
  <link rel="stylesheet" href="../assets/css/tokens.css">

        <p class="eyebrow" id="location-region"></p>

          <p class="location-detail-desc" id="location-desc"></p>

    <section id="location-error" hidden>
      <div class="container" style="padding-block: clamp(56px, 10vw, 104px);">
        <div class="empty-state" id="location-error-text"></div>
        <p class="content-note" style="text-align: center;">
