<!doctype html>
<html lang="en" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading — VOLMERRA</title>
  <meta name="description" content="Reading a chapter of the Volmerra story.">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/seasons.js"></script>
  <script src="../assets/js/season.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section id="reader-page-section" hidden>
      <div class="container reader-page">
        <div class="reader-bar">
          <a class="reader-back" id="reader-back" href="#">← Back to chapter</a>
          <div class="reader-actions">
            <div class="reader-actions-group" id="read-actions"></div>
            <button
              class="btn btn--ghost btn--sm"
              type="button"
              id="read-completed"
            >
              Bitirdim
            </button>
          </div>
          <div class="reader-tools">
            <span class="reader-tools-label">Text size</span>
            <button class="icon-btn" type="button" id="font-smaller" aria-label="Smaller text">A−</button>
            <button class="icon-btn" type="button" id="font-larger" aria-label="Larger text">A+</button>
          </div>
        </div>

        <header class="reader-head">
          <div class="reader-meta">
            <span class="badge" id="reader-number"></span>
            <span class="badge" id="reader-season"></span>
            <span class="badge badge--published" id="reader-status" hidden></span>
          </div>
          <h1 class="reader-title" id="reader-title"></h1>
        </header>

        <div class="reader-prose" id="reader-content"></div>
      </div>
    </section>

    <section id="reader-error" hidden>
      <div class="container" style="padding-block: clamp(56px, 10vw, 104px);">
        <div class="empty-state" id="reader-error-text"></div>
        <p class="content-note" style="text-align: center;">
          <a href="story.html" style="text-decoration: underline;">Back to the Story</a>
        </p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="../assets/js/auth.js?v=3"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/chapters.js"></script>
  <script src="../assets/js/comments.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/search.js"></script>
  <script src="../assets/js/notifications.js"></script>
  <script src="../assets/js/read.js"></script>
  <script src="../assets/js/interactions.js"></script>
</body>
</html>
